services:
  mysql:
    image: mysql:8.0
    container_name: mirage-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mirage123
      MYSQL_DATABASE: mirage_studio
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mirage-backend/mirage-dao/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmirage123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mirage-net

  redis:
    image: redis:7-alpine
    container_name: mirage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mirage-net

  minio:
    image: minio/minio:latest
    container_name: mirage-minio
    environment:
      MINIO_ROOT_USER: mirage
      MINIO_ROOT_PASSWORD: mirage12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mirage-net

  minio-init:
    image: minio/mc:latest
    container_name: mirage-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mirage mirage12345;
      mc mb local/mirage-photos --ignore-existing;
      mc mb local/mirage-splats --ignore-existing;
      mc mb local/mirage-effects --ignore-existing;
      mc mb local/mirage-videos --ignore-existing;
      mc mb local/mirage-models --ignore-existing;
      echo 'MinIO buckets created.';
      "
    networks:
      - mirage-net

  comfyui:
    image: yanwk/comfyui-boot:latest
    container_name: mirage-comfyui
    ports:
      - "8188:8188"
    volumes:
      - comfyui_data:/root/ComfyUI
      - ./mirage-gpu/effect_worker/templates:/root/ComfyUI/templates:ro
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - mirage-net

  nginx:
    image: nginx:alpine
    container_name: mirage-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio
    networks:
      - mirage-net

volumes:
  mysql_data:
  redis_data:
  minio_data:
  comfyui_data:

networks:
  mirage-net:
    driver: bridge
